name: Fader
options:
  bundleIdPrefix: com.mattwesdock
  deploymentTarget:
    macOS: "14.2"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  swift-atomics:
    url: https://github.com/apple/swift-atomics.git
    from: 1.2.0

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Fader:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    dependencies:
      - sdk: Accelerate.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: ServiceManagement.framework
      - package: swift-atomics
        product: Atomics
    sources:
      - path: Fader
        excludes:
          - "**/.DS_Store"
    info:
      path: Fader/Info.plist
      properties:
        CFBundleName: Fader
        CFBundleDisplayName: Fader
        CFBundleIdentifier: com.mattwesdock.Fader
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSPrincipalClass: NSApplication
        LSUIElement: true
        NSMicrophoneUsageDescription: "Fader does not record microphone audio. This key is present only for macOS audio permission compatibility."
        NSAudioCaptureUsageDescription: "Fader captures system and app output locally so it can control per-app volume. It does not record or transmit audio."
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.music
    entitlements:
      path: Fader/Fader.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-unsigned-executable-memory: false
        com.apple.security.cs.disable-library-validation: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattwesdock.Fader
        INFOPLIST_FILE: Fader/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fader/Fader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_EMIT_LOC_STRINGS: YES
  FaderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: FaderTests
    dependencies:
      - target: Fader
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.mattwesdock.FaderTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fader.app/Contents/MacOS/Fader"
